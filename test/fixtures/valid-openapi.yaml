openapi: 3.1.0
info:
  title: Example Photon Resource API
  version: 1.0.0
  description: Reference OpenAPI 3.1 contract conforming to Photon API Design Standards.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.example.com
paths:
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listOrganizationProjects
      summary: List organization projects
      description: Lists projects belonging to an organization, paired with hoisted canonical GET /v1/projects/{projectId}.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Collection of organization projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          description: Invalid pagination parameters or page token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Organization not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new project inside an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project.
          headers:
            Location:
              description: Canonical URL for the created project.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get a project
      description: Retrieves a single project by identifier.
      responses:
        "200":
          description: Project details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateProject
      summary: Update a project
      description: Partially updates an existing project and returns the updated representation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Deletes an existing project.
      responses:
        "204":
          description: Project deleted.
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/usage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectUsage
      summary: Get project usage
      description: Retrieves aggregate usage totals for a project.
      responses:
        "200":
          description: Usage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUsage"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listApiKeys
      summary: List project API keys
      description: Lists API keys belonging to a project.
      responses:
        "200":
          description: Collection of project API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: createApiKey
      summary: Create a project API key
      description: Creates a new API key and returns it flat with its one-time secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created API key with one-time secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/api-keys/{apiKeyId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: apiKeyId
        in: path
        required: true
        description: Unique identifier of the API key.
        schema:
          type: string
    get:
      operationId: getApiKey
      summary: Get an API key
      description: Retrieves metadata for a single project API key.
      responses:
        "200":
          description: API key details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: API key not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/api-keys/{apiKeyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: apiKeyId
        in: path
        required: true
        description: Unique identifier of the API key.
        schema:
          type: string
    post:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Revokes an active project API key.
      responses:
        "200":
          description: Revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: API key not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/webhooks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listWebhooks
      summary: List project webhooks
      description: Lists webhook endpoints configured for a project.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Collection of project webhooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookListResponse"
        "400":
          description: Invalid pagination parameters or page token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: createWebhook
      summary: Create a project webhook
      description: Creates a new webhook endpoint for a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Created webhook.
          headers:
            Location:
              description: Canonical URL for the created webhook.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WebhookId"
    get:
      operationId: getWebhook
      summary: Get a project webhook
      description: Retrieves a single webhook endpoint by identifier.
      responses:
        "200":
          description: Webhook details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          description: Webhook not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateWebhook
      summary: Update a project webhook
      description: Partially updates a webhook endpoint and returns the updated resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: Updated webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          description: Webhook not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      operationId: deleteWebhook
      summary: Delete a project webhook
      description: Deletes a webhook endpoint.
      responses:
        "204":
          description: Webhook deleted.
        "404":
          description: Webhook not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/agent-profile:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getAgentProfile
      summary: Get project agent profile
      description: Retrieves the singleton agent profile for a project.
      responses:
        "200":
          description: Agent profile details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateAgentProfile
      summary: Update project agent profile
      description: Partially updates the singleton agent profile for a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentProfileRequest"
      responses:
        "200":
          description: Updated agent profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/plan-changes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: startPlanChange
      summary: Start a project plan change
      description: Initiates an asynchronous plan change and returns a trackable Operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPlanChangeRequest"
      responses:
        "202":
          description: Plan change accepted for asynchronous processing.
          headers:
            Location:
              required: true
              description: Canonical poll URL for the operation.
              schema:
                type: string
                format: uri
            Retry-After:
              description: Advisory polling delay in seconds.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeOperation"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/operations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectOperations
      summary: List project operations
      description: Lists asynchronous operations belonging to a project.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Collection of project operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationListResponse"
        "400":
          description: Invalid pagination parameters or page token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getProjectOperation
      summary: Get a project operation
      description: Retrieves the current status and outcome of a long-running operation.
      responses:
        "200":
          description: Operation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeOperation"
        "404":
          description: Operation not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/operations/{operationId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: cancelProjectOperation
      summary: Cancel a project operation
      description: Requests cancellation of an in-flight operation.
      responses:
        "200":
          description: Updated operation resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeOperation"
        "409":
          description: Operation is not cancellable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/events/{eventType}:
    parameters:
      - name: eventType
        in: path
        required: true
        description: Event type name in lowerCamelCase.
        schema:
          type: string
    get:
      operationId: getEventTypeSchema
      summary: Get event type metadata
      description: Retrieves documentation metadata for an event type.
      responses:
        "200":
          description: Event metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - eventType
                  - description
                properties:
                  eventType:
                    type: string
                  description:
                    type: string
        "404":
          description: Event type not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Unique identifier of the organization.
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Unique identifier of the project.
      schema:
        type: string
    OperationId:
      name: operationId
      in: path
      required: true
      description: Unique identifier of the operation.
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Unique identifier of the webhook.
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      description: Maximum number of items to return per page. Defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    PageToken:
      name: pageToken
      in: query
      description: Opaque continuation token returned by a previous page.
      schema:
        type: string
        minLength: 1
  schemas:
    BaseResource:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
    Project:
      x-photon-resource:
        type: projects.project
      allOf:
        - $ref: "#/components/schemas/BaseResource"
        - type: object
          required:
            - organizationId
            - name
          properties:
            organizationId:
              type: string
            name:
              type: string
            description:
              type:
                - string
                - "null"
    ProjectSummary:
      x-photon-resource:
        role: slice
        canonical: "#/components/schemas/Project"
      allOf:
        - $ref: "#/components/schemas/BaseResource"
        - type: object
          required:
            - organizationId
            - name
          properties:
            organizationId:
              type: string
            name:
              type: string
    ApiKey:
      x-photon-resource:
        type: projects.api-key
      type: object
      required:
        - id
        - projectId
        - organizationId
        - name
      properties:
        id:
          type: string
          readOnly: true
        projectId:
          type: string
        organizationId:
          type: string
        name:
          type: string
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
    ApiKeyListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    CreateApiKeyRequest:
      x-photon-resource:
        role: create
        canonical: "#/components/schemas/ApiKey"
      type: object
      required:
        - name
      properties:
        name:
          type: string
    ProjectListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        nextPageToken:
          type: string
          minLength: 1
          description: Opaque continuation token for the next page. Omitted on the final page.
    CreateProjectRequest:
      x-photon-resource:
        role: create
        canonical: "#/components/schemas/Project"
        nonResourceInputs:
          - templateId
      type: object
      required:
        - organizationId
        - name
      properties:
        organizationId:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        templateId:
          type: string
    UpdateProjectRequest:
      x-photon-resource:
        role: patch
        canonical: "#/components/schemas/Project"
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type:
            - string
            - "null"
    Webhook:
      x-photon-resource:
        type: webhooks.webhook
      allOf:
        - $ref: "#/components/schemas/BaseResource"
        - type: object
          required:
            - projectId
            - url
            - enabled
          properties:
            projectId:
              type: string
            url:
              type: string
              format: uri
            enabled:
              type: boolean
    WebhookListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
        nextPageToken:
          type: string
          minLength: 1
          description: Opaque continuation token for the next page. Omitted on the final page.
    CreateWebhookRequest:
      x-photon-resource:
        role: create
        canonical: "#/components/schemas/Webhook"
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        enabled:
          type: boolean
    UpdateWebhookRequest:
      x-photon-resource:
        role: patch
        canonical: "#/components/schemas/Webhook"
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
        enabled:
          type: boolean
    AgentProfile:
      x-photon-resource:
        type: agents.profile
      type: object
      required:
        - projectId
        - displayName
      properties:
        projectId:
          type: string
        displayName:
          type: string
        bio:
          type:
            - string
            - "null"
    UpdateAgentProfileRequest:
      x-photon-resource:
        role: patch
        canonical: "#/components/schemas/AgentProfile"
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
        bio:
          type:
            - string
            - "null"
    ProjectUsage:
      type: object
      required:
        - projectId
        - totalCents
      properties:
        projectId:
          type: string
        totalCents:
          type: integer
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
    StartPlanChangeRequest:
      type: object
      required:
        - plan
      properties:
        plan:
          type: string
    PlanChangeOutcome:
      type: object
      required:
        - id
        - projectId
        - plan
      properties:
        id:
          type: string
        projectId:
          type: string
        plan:
          type: string
    RedirectNextAction:
      type: object
      additionalProperties: false
      required:
        - type
        - url
      properties:
        type:
          type: string
          const: redirect
        url:
          type: string
          format: uri
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    ConfirmPaymentNextAction:
      type: object
      additionalProperties: false
      required:
        - type
        - invoiceId
      properties:
        type:
          type: string
          const: confirm_payment
        invoiceId:
          type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    PlanChangeOperationBase:
      type: object
      required:
        - id
        - type
        - status
        - createdAt
        - updatedAt
        - completedAt
        - response
        - error
        - cancellable
        - nextAction
      properties:
        id:
          type: string
        type:
          type: string
          const: plan.change
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancellable:
          type: boolean
    ActivePlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              enum:
                - pending
                - running
            completedAt:
              type: "null"
            response:
              type: "null"
            error:
              type: "null"
            nextAction:
              type: "null"
    RequiresActionPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          required:
            - nextAction
          properties:
            status:
              type: string
              const: requires_action
            completedAt:
              type: "null"
            response:
              type: "null"
            error:
              type: "null"
            nextAction:
              oneOf:
                - $ref: "#/components/schemas/RedirectNextAction"
                - $ref: "#/components/schemas/ConfirmPaymentNextAction"
    SucceededPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              const: succeeded
            completedAt:
              type: string
              format: date-time
            response:
              $ref: "#/components/schemas/PlanChangeOutcome"
            error:
              type: "null"
            nextAction:
              type: "null"
    FailedPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              const: failed
            completedAt:
              type: string
              format: date-time
            response:
              type: "null"
            error:
              $ref: "#/components/schemas/ProblemDetails"
            nextAction:
              type: "null"
    CancelledPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              const: cancelled
            completedAt:
              type: string
              format: date-time
            response:
              type: "null"
            error:
              type: "null"
            nextAction:
              type: "null"
    PlanChangeOperation:
      x-photon-resource:
        type: projects.operation
      oneOf:
        - $ref: "#/components/schemas/ActivePlanChangeOperation"
        - $ref: "#/components/schemas/RequiresActionPlanChangeOperation"
        - $ref: "#/components/schemas/SucceededPlanChangeOperation"
        - $ref: "#/components/schemas/FailedPlanChangeOperation"
        - $ref: "#/components/schemas/CancelledPlanChangeOperation"
    OperationListResponse:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/PlanChangeOperation"
        nextPageToken:
          type: string
          minLength: 1
          description: Opaque continuation token for the next page. Omitted on the final page.
