openapi: 3.1.0
info:
  title: Example Photon Resource API
  version: 1.0.0
  description: Reference OpenAPI 3.1 contract conforming to Photon API Design Standards.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.example.com
paths:
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new project inside an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get a project
      description: Retrieves a single project by identifier.
      responses:
        "200":
          description: Project details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Deletes an existing project.
      responses:
        "204":
          description: Project deleted.
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/usage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectUsage
      summary: Get project usage
      description: Retrieves aggregate usage totals for a project.
      responses:
        "200":
          description: Usage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUsage"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listApiKeys
      summary: List project API keys
      description: Lists API keys belonging to a project.
      responses:
        "200":
          description: Collection of project API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: createApiKey
      summary: Create a project API key
      description: Creates a new API key and returns it flat with its one-time secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created API key with one-time secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/api-keys/{apiKeyId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: apiKeyId
        in: path
        required: true
        description: Unique identifier of the API key.
        schema:
          type: string
    get:
      operationId: getApiKey
      summary: Get an API key
      description: Retrieves metadata for a single project API key.
      responses:
        "200":
          description: API key details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: API key not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/plan-changes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: startPlanChange
      summary: Start a project plan change
      description: Initiates an asynchronous plan change and returns a trackable Operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPlanChangeRequest"
      responses:
        "202":
          description: Plan change accepted for asynchronous processing.
          headers:
            Location:
              description: Canonical poll URL for the operation.
              schema:
                type: string
                format: uri
            Retry-After:
              description: Advisory polling delay in seconds.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeOperation"
        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/operations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectOperations
      summary: List project operations
      description: Lists asynchronous operations belonging to a project.
      responses:
        "200":
          description: Collection of project operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationListResponse"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getProjectOperation
      summary: Get a project operation
      description: Retrieves the current status and outcome of a long-running operation.
      responses:
        "200":
          description: Operation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeOperation"
        "404":
          description: Operation not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/projects/{projectId}/operations/{operationId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: cancelProjectOperation
      summary: Cancel a project operation
      description: Requests cancellation of an in-flight operation.
      responses:
        "200":
          description: Updated operation resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeOperation"
        "409":
          description: Operation is not cancellable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/events/{eventType}:
    parameters:
      - name: eventType
        in: path
        required: true
        description: Event type name in lowerCamelCase.
        schema:
          type: string
    get:
      operationId: getEventTypeSchema
      summary: Get event type metadata
      description: Retrieves documentation metadata for an event type.
      responses:
        "200":
          description: Event metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - eventType
                  - description
                properties:
                  eventType:
                    type: string
                  description:
                    type: string
        "404":
          description: Event type not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Unique identifier of the organization.
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Unique identifier of the project.
      schema:
        type: string
    OperationId:
      name: operationId
      in: path
      required: true
      description: Unique identifier of the operation.
      schema:
        type: string
  schemas:
    BaseResource:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
    Project:
      allOf:
        - $ref: "#/components/schemas/BaseResource"
        - type: object
          required:
            - organizationId
            - name
          properties:
            organizationId:
              type: string
            name:
              type: string
    ApiKey:
      type: object
      required:
        - id
        - projectId
        - organizationId
        - name
      properties:
        id:
          type: string
        projectId:
          type: string
        organizationId:
          type: string
        name:
          type: string
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
    ApiKeyListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CreateProjectRequest:
      type: object
      required:
        - organizationId
        - name
      properties:
        organizationId:
          type: string
        name:
          type: string
    ProjectUsage:
      type: object
      required:
        - projectId
        - totalCents
      properties:
        projectId:
          type: string
        totalCents:
          type: integer
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
    StartPlanChangeRequest:
      type: object
      required:
        - plan
      properties:
        plan:
          type: string
    PlanChangeOutcome:
      type: object
      required:
        - id
        - projectId
        - plan
      properties:
        id:
          type: string
        projectId:
          type: string
        plan:
          type: string
    RedirectNextAction:
      type: object
      required:
        - type
        - url
      properties:
        type:
          type: string
          const: redirect
        url:
          type: string
          format: uri
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    ConfirmPaymentNextAction:
      type: object
      required:
        - type
        - invoiceId
      properties:
        type:
          type: string
          const: confirm_payment
        invoiceId:
          type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    PlanChangeOperationBase:
      type: object
      required:
        - id
        - type
        - status
        - createdAt
        - updatedAt
        - completedAt
        - response
        - error
        - cancellable
      properties:
        id:
          type: string
        type:
          type: string
          const: plan.change
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancellable:
          type: boolean
    ActivePlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              enum:
                - pending
                - running
            completedAt:
              type: "null"
            response:
              type: "null"
            error:
              type: "null"
            nextAction:
              type: "null"
    RequiresActionPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          required:
            - nextAction
          properties:
            status:
              type: string
              const: requires_action
            completedAt:
              type: "null"
            response:
              type: "null"
            error:
              type: "null"
            nextAction:
              oneOf:
                - $ref: "#/components/schemas/RedirectNextAction"
                - $ref: "#/components/schemas/ConfirmPaymentNextAction"
    SucceededPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              const: succeeded
            completedAt:
              type: string
              format: date-time
            response:
              $ref: "#/components/schemas/PlanChangeOutcome"
            error:
              type: "null"
            nextAction:
              type: "null"
    FailedPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              const: failed
            completedAt:
              type: string
              format: date-time
            response:
              type: "null"
            error:
              $ref: "#/components/schemas/ProblemDetails"
            nextAction:
              type: "null"
    CancelledPlanChangeOperation:
      allOf:
        - $ref: "#/components/schemas/PlanChangeOperationBase"
        - type: object
          properties:
            status:
              type: string
              const: cancelled
            completedAt:
              type: string
              format: date-time
            response:
              type: "null"
            error:
              type: "null"
            nextAction:
              type: "null"
    PlanChangeOperation:
      oneOf:
        - $ref: "#/components/schemas/ActivePlanChangeOperation"
        - $ref: "#/components/schemas/RequiresActionPlanChangeOperation"
        - $ref: "#/components/schemas/SucceededPlanChangeOperation"
        - $ref: "#/components/schemas/FailedPlanChangeOperation"
        - $ref: "#/components/schemas/CancelledPlanChangeOperation"
    OperationListResponse:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/PlanChangeOperation"
        nextPageToken:
          type:
            - string
            - "null"
